    <!-- ⚡ Ultra-fast, zero-jank hardware-accelerated inline styles for the PrintBooth loading splash -->
    <style>
      :root {
        --ink: #0a0f13;
        --yellow: #f3b023;
        --purple: #7f17b2;
        --darkblue: #3253ec;
        --cyan: #00c2f2;
        --skyblue: #29c2ff;
        --bg: #e0e5ec;
        box-sizing: border-box;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        background: var(--bg);
        color: var(--ink);
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100%;
        max-width: 100%;
        overflow-x: hidden;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* Branded lightweight splash shown while bundle downloads */
      #pb-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: var(--bg);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        contain: strict;
      }

      #pb-splash.pb-splash--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      canvas#bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      /* Stage */
      .stage {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1.2rem;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .stage.live {
        opacity: 1;
      }

      .word {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        line-height: 0.9;
        position: relative;
      }
      .word.top {
        font-size: clamp(2.6rem, 10vw, 8rem);
        letter-spacing: -0.01em;
      }
      .word.bottom {
        font-size: clamp(1.4rem, 5.2vw, 4.2rem);
        margin-top: 0.28em;
        letter-spacing: 0.22em;
        padding-left: 0.22em;
      }

      .letter {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        color: var(--ink);
        display: inline-block;
        position: relative;
        opacity: 0;
        transform: translate3d(0, 18px, 0) scale(0.92);
        will-change: transform, opacity;
      }
      .letter.in {
        animation: land 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes land {
        0% {
          opacity: 0;
          transform: translate3d(0, 18px, 0) scale(0.92);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      .shard {
        background: linear-gradient(124deg, var(--yellow) 0%, var(--yellow) 18%, var(--purple) 42%, var(--darkblue) 60%, var(--cyan) 76%, var(--skyblue) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        position: relative;
        overflow: hidden;
      }
      .shard::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 50%;
        height: 100%;
        background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.85) 50%, transparent 80%);
        mix-blend-mode: screen;
        transform: translate3d(-150%, 0, 0);
        will-change: transform;
        animation: sheen 3.2s cubic-bezier(0.16, 1, 0.3, 1) 1.2s infinite;
      }
      @keyframes sheen {
        0%, 50% { transform: translate3d(-150%, 0, 0); }
        100% { transform: translate3d(350%, 0, 0); }
      }

      .scanline {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 14%;
        background: linear-gradient(90deg, transparent 0%, rgba(41, 194, 255, 0.08) 25%, rgba(41, 194, 255, 0.45) 50%, rgba(123, 23, 178, 0.45) 75%, transparent 100%);
        pointer-events: none;
        opacity: 0;
        transform: translate3d(-200%, 0, 0);
        will-change: transform, opacity;
      }
      .scanline.sweep {
        animation: sweep 1.05s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes sweep {
        0% { transform: translate3d(-150%, 0, 0); opacity: 0.9; }
        80% { opacity: 0.8; }
        100% { transform: translate3d(900%, 0, 0); opacity: 0; }
      }

      .tagline {
        margin-top: 1.1em;
        letter-spacing: 0.32em;
        font-size: clamp(0.62rem, 2vw, 1.05rem);
        color: var(--ink);
        font-weight: 400;
        font-family: 'Poppins', sans-serif;
        opacity: 0;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translate3d(0, 8px, 0);
        display: flex;
        align-items: center;
        gap: 0.6em;
        text-transform: uppercase;
      }
      .tagline.in {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      .tagline .dot {
        width: 0.42em;
        height: 0.42em;
        border-radius: 50%;
        background: var(--skyblue);
        display: inline-block;
        box-shadow: 0 0 6px rgba(41, 194, 255, 0.7);
      }

      @media (prefers-reduced-motion: reduce) {
        .letter { animation: none !important; opacity: 1 !important; transform: none !important; }
        .tagline { transition: none; opacity: 1; transform: none; }
        .shard::after, .scanline { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- Splash overlay — lightweight 2D ambient particles & hardware-accelerated text reveal -->
    <div id="pb-splash" aria-hidden="true">
      <canvas id="bg"></canvas>
      <div class="stage" id="stage">
        <div class="scanline" id="scanline"></div>
        <div class="word top" id="wordTop"></div>
        <div class="word bottom" id="wordBottom"></div>
        <div class="tagline" id="tagline">
          <span>Smart</span><span class="dot"></span><span>Self-Service</span><span class="dot"></span><span>Printing</span>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ⚡ Ultra-smooth, zero-GPU overhead splash script -->
    <script>
      (function () {
        var TOP = "PRINTING";
        var BOTTOM = "BOOTH";
        var shardIndices = new Set([3]); // 'N'

        function buildWord(str, el, shard) {
          if (!el) return;
          var frag = document.createDocumentFragment();
          for (var i = 0; i < str.length; i++) {
            var span = document.createElement('span');
            span.className = 'letter' + (shard && shard.has(i) ? ' shard' : '') + ' in';
            span.textContent = str[i];
            span.style.animationDelay = (i * 0.05) + 's';
            frag.appendChild(span);
          }
          el.appendChild(frag);
        }

        buildWord(TOP, document.getElementById('wordTop'), shardIndices);
        buildWord(BOTTOM, document.getElementById('wordBottom'));

        var stage = document.getElementById('stage');
        var scanline = document.getElementById('scanline');
        var tagline = document.getElementById('tagline');

        if (stage) stage.classList.add('live');
        if (scanline) scanline.classList.add('sweep');

        setTimeout(function () {
          if (tagline) tagline.classList.add('in');
        }, 500);

        // ── Lightweight, silky 2D Canvas particles (0% GPU spike, 0 dependencies) ──
        var canvas = document.getElementById('bg');
        var animId = null;
        var running = true;

        function resize() {
          if (!document.getElementById('pb-splash') || !canvas) return;
          var width = window.innerWidth;
          var height = window.innerHeight;
          var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          var ctx = canvas.getContext('2d', { alpha: true });
          if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        if (canvas) {
          var ctx = canvas.getContext('2d', { alpha: true });
          var colors = ['#f3b023', '#7f17b2', '#3253ec', '#00c2f2', '#29c2ff'];
          var COUNT = 48;
          var dots = [];

          resize();
          window.addEventListener('resize', resize, { passive: true });

          for (var i = 0; i < COUNT; i++) {
            dots.push({
              x: Math.random() * (window.innerWidth || 1000),
              y: Math.random() * (window.innerHeight || 800),
              r: 1.2 + Math.random() * 2.2,
              color: colors[i % colors.length],
              vx: (Math.random() - 0.5) * 0.35,
              vy: (Math.random() - 0.5) * 0.35,
              alpha: 0.3 + Math.random() * 0.5,
              pulse: Math.random() * Math.PI * 2,
              pulseSpeed: 0.02 + Math.random() * 0.025
            });
          }

          function render() {
            if (!running || !document.getElementById('pb-splash') || !ctx) return;
            if (document.hidden) {
              animId = requestAnimationFrame(render);
              return;
            }
            var w = window.innerWidth;
            var h = window.innerHeight;
            ctx.clearRect(0, 0, w, h);

            for (var k = 0; k < COUNT; k++) {
              var d = dots[k];
              d.x += d.vx;
              d.y += d.vy;
              d.pulse += d.pulseSpeed;

              if (d.x < -10) d.x = w + 10;
              else if (d.x > w + 10) d.x = -10;
              if (d.y < -10) d.y = h + 10;
              else if (d.y > h + 10) d.y = -10;

              var a = d.alpha * (0.8 + 0.2 * Math.sin(d.pulse));
              ctx.globalAlpha = a;
              ctx.fillStyle = d.color;
              ctx.beginPath();
              ctx.arc(d.x, d.y, d.r, 0, 6.28318);
              ctx.fill();
            }

            animId = requestAnimationFrame(render);
          }
          animId = requestAnimationFrame(render);
        }

        // Dismiss the splash when React root mounts
        var splashStart = performance.now();
        function dismissSplash() {
          var splash = document.getElementById('pb-splash');
          if (!splash || splash.classList.contains('pb-splash--hidden')) return;
          running = false;
          if (animId) cancelAnimationFrame(animId);
          window.removeEventListener('resize', resize);
          splash.classList.add('pb-splash--hidden');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 450);
        }

        function checkReady() {
          var elapsed = performance.now() - splashStart;
          var remaining = Math.max(0, 700 - elapsed);
          setTimeout(dismissSplash, remaining);
        }

        var observer = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) {
            observer.disconnect();
            checkReady();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: false });

        // Safety fallback: always dismiss after 4s
        setTimeout(dismissSplash, 4000);
      })();
    </script>
